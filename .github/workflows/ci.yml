name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      version:
        type: string
        default: ""
      artifact-name:
        type: string
        default: dist
permissions:
  contents: read
jobs:
  check:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: windows-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Set preview package version
        if: inputs.version != ''
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          uv run --no-sync python scripts/set_version.py "$PACKAGE_VERSION"
          uv pip install --no-deps -e .
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync pytest -q
      - run: uv build --no-sources
      - run: uv run --no-sync twine check dist/*
      - name: Install wheel in an isolated environment
        shell: bash
        run: |
          uv venv smoke-env
          if [ "$RUNNER_OS" = Windows ]; then
            PYTHON=smoke-env/Scripts/python.exe
          else
            PYTHON=smoke-env/bin/python
          fi
          uv pip install --python "$PYTHON" dist/*.whl
          "$PYTHON" -I -c "import ageha; from importlib.metadata import version; from ageha import Chat, TTS; assert ageha.__version__ == version('ageha'); assert Chat.__name__ == 'Chat' and TTS.__name__ == 'TTS'; print(version('ageha')); print('Chat and TTS imports passed')"
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: ${{ inputs.artifact-name || 'dist' }}
          path: dist/*
          if-no-files-found: error
