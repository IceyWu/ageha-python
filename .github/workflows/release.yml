name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  release:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      pr: ${{ steps.release.outputs.pr }}
      prs-created: ${{ steps.release.outputs.prs_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
      - uses: actions/checkout@v7
        if: steps.release.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
      - uses: astral-sh/setup-uv@v10
        if: steps.release.outputs.prs_created == 'true'
      - name: Refresh version metadata in lockfile
        if: steps.release.outputs.prs_created == 'true'
        run: |
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync release lockfile"
            git push
          fi
  release-pr-quality:
    if: needs.release.outputs.prs-created == 'true'
    needs: release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ fromJSON(needs.release.outputs.pr).headBranchName }}
      artifact-name: release-pr-dist
  release-build:
    if: needs.release.outputs.created == 'true'
    needs: release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
      artifact-name: release-dist
  publish:
    if: needs.release.outputs.created == 'true' && vars.PYPI_ENABLED == 'true'
    needs: [release, release-build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - run: python scripts/verify_registry.py pypi dist
