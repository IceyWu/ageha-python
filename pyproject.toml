[project]
name = "ageha"
version = "0.0.0"
description = "A Python toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Lev Wu"}]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/IceyWu/ageha-python"
Repository = "https://github.com/IceyWu/ageha-python"
Issues = "https://github.com/IceyWu/ageha-python/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2", "twine>=6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ageha"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
